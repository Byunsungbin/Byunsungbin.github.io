
media:
  input: images/uploads
  output: /images/uploads

content:
  - name: site
    label: Director Profile
    type: file
    path: content/site.json
    format: json
    fields:
      - name: name
        label: Name
        type: string
      - name: role
        label: Role
        type: string
      - name: headline
        label: Headline
        type: string
      - name: intro_note
        label: Introduction
        type: text
      - name: hero_label
        label: Featured Work Label
        type: string
      - name: hero_title
        label: Featured Film Title
        type: string
      - name: hero_meta
        label: Featured Film Details
        type: string
      - name: hero_image
        label: Main Image
        type: image
      - name: about_heading
        label: About Heading
        type: string
      - name: bio_paragraph_1
        label: Biography Paragraph 1
        type: text
      - name: bio_paragraph_2
        label: Biography Paragraph 2
        type: text
      - name: contact_intro
        label: Contact Introduction
        type: string
      - name: email
        label: Email
        type: string
      - name: company
        label: Company
        type: string

  - name: films
    label: Filmography
    type: file
    path: content/films.json
    format: json
    list: true
    fields:
      - name: title
        label: Film Title
        type: string
        required: true
      - name: year
        label: Year
        type: string
      - name: format
        label: Film Format
        type: string
      - name: image
        label: Film Image
        type: image
      - name: alt
        label: Image Description
        type: string
